communication_preferences:
  language: "简体中文"
  tone:
    - "清晰"
    - "平实"
    - "有洞察"
    - "批判性"
    - "少套话"
  requirements:
    - "事实与假设分开"
    - "不杜撰来源、数据或案例"
    - "明确可执行性与风险"

deliverable_preferences:
  image:
    default_aspect_ratio: "16:9"
    preferred_resolution: "3840x2160"
    preferred_format: "PNG"
    independent_files: true
    avoid_ai_generated_text_or_logos: true
    do_not_fake_upscale_to_4k: true
  presentation:
    format: ".pptx"
    editable_text_and_structure: true
    prefer_rendered_visual_layers: true
    avoid_mojibake: true
    progression: "策略内容 → 预览确认 → 扩展 → 可编辑交付"
    preserve_supplied_logo_assets: true

privacy:
  do_not_publish:
    - "私人联系方式和详细住址"
    - "未授权公开的客户项目细节"
    - "合同、报价与供应商敏感成本"
    - "个人敏感信息与内部文件"
  scope_note: "本文件仅用于公开、低敏感度的职业 AI 协作上下文"

knowledgebase:
  public_profile: "ai-profile/README.md"
  quick_context: "ai-profile/QUICK_CONTEXT.md"
  work_protocol: "ai-profile/WORKFLOWS.md"
  case_template: "ai-profile/CASE_TEMPLATE.md"
  quality_check: "ai-profile/QUALITY_CHECKLIST.md"
  skill_map: "ai-profile/SKILL_MAP.md"
  privacy_policy: "ai-profile/PRIVACY.md"
  private_starter: "private-vault-starter/README.md"

career_development:
  priorities:
    - "内容驱动的创意策略"
    - "大型演出与综艺化现场机制"
    - "有证据的作品集与能力沉淀"
  evidence_policy: "经历与成果以本人实际职责和可核实资料为准，不编造指标"

context_rules:
  source_of_truth: "当前任务 Brief 与最新确认事实优先于存档"
  confidence_levels:
    - "user_confirmed"
    - "externally_verified"
    - "hypothesis"
    - "needs_confirmation"
  privacy_boundary: "本公开仓库不写入私人信息及客户保密资料"
